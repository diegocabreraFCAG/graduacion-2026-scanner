<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Control de Ingreso - Graduación 2026</title>

  <!--
    Librería de lectura de QR (html5-qrcode 2.3.8), hospedada LOCALMENTE en este repo.
    El archivo html5-qrcode.min.js debe estar en la MISMA carpeta que este index.html.
    Así el lector NO depende de ningún CDN externo el día del evento.
  -->
  <script src="./html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #333;
    }

    .contenedor {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .encabezado {
      background: #494949;
      color: white;
      text-align: center;
      padding: 20px 15px;
      border-radius: 0 0 15px 15px;
    }

    .encabezado h1 { margin: 0; font-size: 22px; }
    .encabezado p  { margin: 8px 0 0; font-size: 14px; }

    .tarjeta {
      background: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }

    #reader {
      width: 100%;
      display: none;
      margin-top: 15px;
      border-radius: 10px;
      overflow: hidden;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .boton-camara    { background: #d0242e; color: white; }
    .boton-manual    { background: #494949; color: white; }
    .boton-siguiente { background: #5794cd; color: white; display: none; }

    .enlace-manual {
      display: block;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #5794cd;
      text-decoration: underline;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    #resultado h2 { margin-top: 0; font-size: 24px; }
    #resultado p  { margin: 8px 0; font-size: 17px; }

    .valido    { background: #dff5e1; border: 2px solid #2e9b42; color: #176b27; }
    .utilizado { background: #fff0d6; border: 2px solid #e39a24; color: #8a5700; }
    .invalido  { background: #ffe0e0; border: 2px solid #d0242e; color: #a00000; }
    .error     { background: #ffe0e0; border: 2px solid #d0242e; color: #a00000; }
    .cargando  { background: #eef4fb; border: 2px solid #5794cd; color: #2c5a8a; }

    .manual { display: none; margin-top: 15px; }

    .codigo {
      font-family: monospace;
      font-size: 15px;
      font-weight: bold;
      word-break: break-all;
      opacity: 0.8;
    }

    .pie {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="encabezado">
    <h1>GRADUACIÓN 2026</h1>
    <p>Control de ingreso</p>
  </div>

  <div class="contenedor">

    <div class="tarjeta">

      <button id="botonCamara" class="boton-camara" onclick="iniciarCamara()">
        📷 ESCANEAR CÓDIGO QR
      </button>

      <div id="reader"></div>

      <span class="enlace-manual" id="enlaceManual" onclick="toggleManual()">
        Ingresar código manualmente
      </span>

      <div class="manual" id="manual">
        <input id="codigoManual" type="text" placeholder="Ingrese el código (IAG-2026-...)">
        <button class="boton-manual" onclick="verificarManual()">
          VERIFICAR CÓDIGO
        </button>
      </div>

      <button id="botonSiguiente" class="boton-siguiente" onclick="reiniciarScanner()">
        📷 ESCANEAR SIGUIENTE
      </button>

      <div id="resultado"></div>

    </div>

    <div class="pie">
      Instituto Austriaco Guatemalteco
    </div>

  </div>


<script>

  /* ============================================================
   * URL DEL WEB APP DE APPS SCRIPT
   * Reemplázala por la URL /exec de tu implementación ACTUAL.
   * Al actualizar el script usa "Administrar implementaciones →
   * editar → nueva versión" para conservar esta MISMA URL.
   * ============================================================ */
  const API_URL =
    'https://script.google.com/macros/s/AKfycbzxvNZ-nyQwMsO7okkfzeAzRKeXaLkMUlbrsJLObCVS2_6osSBCJgrBJZhLUKQR1Fg/exec';

  const TIMEOUT_MS = 20000;

  let scanner    = null;
  let procesando = false;


  /* ------------------------------------------------------------
   * INICIAR CÁMARA
   * ---------------------------------------------------------- */
  async function iniciarCamara() {

    document.getElementById('resultado').style.display      = 'none';
    document.getElementById('reader').style.display         = 'block';
    document.getElementById('botonCamara').style.display    = 'none';
    document.getElementById('manual').style.display         = 'none';
    document.getElementById('enlaceManual').style.display   = 'none';
    document.getElementById('botonSiguiente').style.display = 'none';

    procesando = false;

    try {

      scanner = new Html5Qrcode('reader');

      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        mostrarError('No se encontró ninguna cámara en este dispositivo.');
        mostrarManual();
        return;
      }

      // Preferir la cámara trasera
      let camaraSeleccionada = cameras[cameras.length - 1].id;

      for (const camara of cameras) {
        const nombre = (camara.label || '').toLowerCase();
        if (nombre.includes('back')    ||
            nombre.includes('rear')    ||
            nombre.includes('trasera') ||
            nombre.includes('environment')) {
          camaraSeleccionada = camara.id;
          break;
        }
      }

      await scanner.start(
        camaraSeleccionada,
        { fps: 10, qrbox: { width: 250, height: 250 } },
        codigoDetectado,
        () => {}   // ignorar frames sin QR
      );

    } catch (error) {
      console.error(error);
      mostrarError(
        'No se pudo acceder a la cámara. ' +
        'Verifique que el navegador tenga permiso para usarla.'
      );
      mostrarManual();
    }
  }


  /* ------------------------------------------------------------
   * CUANDO SE DETECTA UN QR
   * ---------------------------------------------------------- */
  function codigoDetectado(codigo) {
    if (procesando) return;
    procesando = true;
    detenerCamara();
    verificarCodigo(codigo);
  }


  /* ------------------------------------------------------------
   * DETENER CÁMARA
   * ---------------------------------------------------------- */
  async function detenerCamara() {
    if (scanner) {
      try { await scanner.stop(); } catch (error) { console.log(error); }
      try { scanner.clear(); } catch (error) { console.log(error); }
      scanner = null;
    }
    document.getElementById('reader').style.display = 'none';
  }


  /* ------------------------------------------------------------
   * VERIFICAR CÓDIGO (una sola implementación, vía JSONP)
   * ---------------------------------------------------------- */
  function verificarCodigo(codigo) {

    codigo = String(codigo).trim().toUpperCase();

    if (!codigo) {
      mostrarError('Debe ingresar un código.');
      procesando = false;
      return;
    }

    mostrarCargando();

    const callback = 'respuestaQR_' + Date.now() +
                     '_' + Math.floor(Math.random() * 100000);

    const script   = document.createElement('script');
    let   terminado = false;

    // Limpieza común
    function limpiar() {
      clearTimeout(timeout);
      try { delete window[callback]; } catch (e) { window[callback] = undefined; }
      if (script.parentNode) script.remove();
    }

    // Respuesta correcta del servidor
    window[callback] = function(resultado) {
      if (terminado) return;
      terminado = true;
      limpiar();
      mostrarResultado(resultado, codigo);
    };

    // Falla de conexión / carga
    script.onerror = function() {
      if (terminado) return;
      terminado = true;
      limpiar();
      mostrarError(
        'No fue posible comunicarse con el sistema. Verifique la conexión.'
      );
    };

    // Tiempo máximo de espera
    const timeout = setTimeout(function() {
      if (terminado) return;
      terminado = true;
      limpiar();
      mostrarError(
        'El sistema tardó demasiado en responder.<br><br>' +
        '<em>Si la conexión se cortó al final, es posible que el ingreso ' +
        'SÍ se haya registrado. Al reescanear, un aviso de ' +
        '"YA UTILIZADO" confirma que la persona ya pasó.</em>'
      );
    }, TIMEOUT_MS);

    // Construir y enviar la solicitud
    script.src =
      API_URL +
      '?action=verificar' +
      '&codigo='   + encodeURIComponent(codigo) +
      '&callback=' + callback +
      '&_=' + Date.now();   // evita cualquier caché

    document.body.appendChild(script);
  }


  /* ------------------------------------------------------------
   * INGRESO MANUAL
   * ---------------------------------------------------------- */
  function verificarManual() {
    const codigo = document.getElementById('codigoManual').value;
    procesando = true;
    verificarCodigo(codigo);
  }


  /* ------------------------------------------------------------
   * MOSTRAR RESULTADO
   * ---------------------------------------------------------- */
  function mostrarResultado(resultado, codigo) {

    const caja = document.getElementById('resultado');
    caja.style.display = 'block';
    caja.className = '';

    const lineaCodigo = codigo
      ? '<p class="codigo">Código: ' + escapeHTML(codigo) + '</p>'
      : '';

    if (resultado.estado === 'VALIDO') {
      caja.classList.add('valido');
      caja.innerHTML = `
        <h2>✅ INGRESO AUTORIZADO</h2>
        <p><strong>Invitado:</strong><br>${escapeHTML(resultado.invitado)}</p>
        <p><strong>Graduando:</strong><br>${escapeHTML(resultado.graduando)}</p>
        ${lineaCodigo}
      `;
    }
    else if (resultado.estado === 'UTILIZADO') {
      caja.classList.add('utilizado');
      caja.innerHTML = `
        <h2>⚠️ QR YA UTILIZADO</h2>
        <p>Este código ya fue registrado anteriormente.</p>
        <p><strong>Invitado:</strong><br>${escapeHTML(resultado.invitado)}</p>
        <p><strong>Graduando:</strong><br>${escapeHTML(resultado.graduando)}</p>
        ${lineaCodigo}
      `;
    }
    else if (resultado.estado === 'INVALIDO') {
      caja.classList.add('invalido');
      caja.innerHTML = `
        <h2>❌ QR NO VÁLIDO</h2>
        <p>El código no pertenece a una invitación registrada.</p>
        ${lineaCodigo}
      `;
    }
    else {
      mostrarError(resultado.mensaje || 'Ocurrió un error al verificar el código.');
      return;
    }

    document.getElementById('botonSiguiente').style.display = 'block';
    procesando = false;
  }


  /* ------------------------------------------------------------
   * PANTALLA DE CARGA
   * ---------------------------------------------------------- */
  function mostrarCargando() {
    const caja = document.getElementById('resultado');
    caja.style.display = 'block';
    caja.className = 'cargando';
    caja.innerHTML = `
      <h2>VERIFICANDO…</h2>
      <p>🔄 Conectando con el sistema.</p>
    `;
  }


  /* ------------------------------------------------------------
   * ERROR
   * ---------------------------------------------------------- */
  function mostrarError(mensaje) {
    const caja = document.getElementById('resultado');
    caja.style.display = 'block';
    caja.className = 'error';
    caja.innerHTML = `<h2>ERROR</h2><p>${mensaje}</p>`;
    document.getElementById('botonSiguiente').style.display = 'block';
    procesando = false;
  }


  /* ------------------------------------------------------------
   * MOSTRAR OPCIÓN MANUAL (cuando falla la cámara)
   * ---------------------------------------------------------- */
  function mostrarManual() {
    document.getElementById('manual').style.display       = 'block';
    document.getElementById('botonCamara').style.display  = 'block';
    document.getElementById('enlaceManual').style.display = 'block';
  }


  /* ------------------------------------------------------------
   * TOGGLE del ingreso manual (enlace)
   * ---------------------------------------------------------- */
  function toggleManual() {
    const manual = document.getElementById('manual');
    manual.style.display = (manual.style.display === 'block') ? 'none' : 'block';
    if (manual.style.display === 'block') {
      document.getElementById('codigoManual').focus();
    }
  }


  /* ------------------------------------------------------------
   * REINICIAR PARA EL SIGUIENTE INVITADO
   * ---------------------------------------------------------- */
  function reiniciarScanner() {
    document.getElementById('resultado').style.display      = 'none';
    document.getElementById('botonSiguiente').style.display = 'none';
    document.getElementById('codigoManual').value = '';
    procesando = false;
    iniciarCamara();
  }


  /* ------------------------------------------------------------
   * PROTEGER TEXTO HTML
   * ---------------------------------------------------------- */
  function escapeHTML(texto) {
    const div = document.createElement('div');
    div.textContent = texto || '';
    return div.innerHTML;
  }

</script>

</body>
</html>
